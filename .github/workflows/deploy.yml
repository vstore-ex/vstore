name: deploy backend to aca

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login vstoreacr.azurecr.io -u ${{ secrets.ACR_USERNAME }} --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t vstoreacr.azurecr.io/vstore-backend:${{ github.sha }} .
          docker build -t vstoreacr.azurecr.io/vstore-backend:latest .
          docker push vstoreacr.azurecr.io/vstore-backend:${{ github.sha }}
          docker push vstoreacr.azurecr.io/vstore-backend:latest

      - name: Deployment Info
        run: |
          echo "Image pushed"
          echo "Now run this command in your terminal to finish deployment:"
          echo "az containerapp update --name vstore-backend --resource-group vstore-rg --image vstoreacr.azurecr.io/vstore-backend:latest"
